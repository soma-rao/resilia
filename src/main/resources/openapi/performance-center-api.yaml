openapi: 3.0.3
info:
  title: OpenText / Micro Focus Performance Center REST API
  description: OpenAPI specification for Micro Focus / OpenText LoadRunner Enterprise & Performance Center REST API.
  version: "1.0.0"
servers:
  - url: /LoadRunner/service-layer
    description: Performance Center REST API base path

paths:
  /authentication-point/authenticate:
    post:
      summary: Authenticate user
      description: Logs in a user to the Performance Center / LoadRunner Enterprise server.
      tags:
        - Authentication
      security:
        - basicAuth: []
      responses:
        '200':
          description: Successfully authenticated with LWSSO cookie/token returned
          headers:
            Set-Cookie:
              schema:
                type: string
                description: LWSSO_COOKIE_KEY session token
        '401':
          description: Unauthorized

  /authentication-point/logout:
    get:
      summary: Logout user
      description: Terminates the user session.
      tags:
        - Authentication
      responses:
        '200':
          description: Successfully logged out

  /rest/domains:
    get:
      summary: Get all domains
      tags:
        - Domains
      responses:
        '200':
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainDTO'

  /rest/domains/{domain}/projects:
    get:
      summary: Get projects in a domain
      tags:
        - Projects
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectDTO'

  /rest/domains/{domain}/projects/{project}/tests:
    get:
      summary: Get tests in a project
      tags:
        - Tests
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestDTO'
    post:
      summary: Create a new performance test
      tags:
        - Tests
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCreateDTO'
      responses:
        '201':
          description: Test created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDTO'

  /rest/domains/{domain}/projects/{project}/tests/{testId}:
    get:
      summary: Get test by ID
      tags:
        - Tests
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: testId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Test details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDTO'
        '404':
          description: Test not found
    delete:
      summary: Delete test
      tags:
        - Tests
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: testId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Test deleted

  /rest/domains/{domain}/projects/{project}/test-sets:
    get:
      summary: Get test sets
      tags:
        - Test Sets
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of test sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestSetDTO'
    post:
      summary: Create test set
      tags:
        - Test Sets
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSetDTO'
      responses:
        '201':
          description: Test set created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSetDTO'

  /rest/domains/{domain}/projects/{project}/runs:
    get:
      summary: Get test runs
      tags:
        - Test Runs
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunDTO'
    post:
      summary: Start a new test run
      tags:
        - Test Runs
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreateRequestDTO'
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDTO'

  /rest/domains/{domain}/projects/{project}/runs/{runId}:
    get:
      summary: Get test run details
      tags:
        - Test Runs
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDTO'
        '404':
          description: Run not found

  /rest/domains/{domain}/projects/{project}/runs/{runId}/stop:
    post:
      summary: Stop a running test
      tags:
        - Test Runs
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Stop command acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDTO'

  /rest/domains/{domain}/projects/{project}/runs/{runId}/results:
    get:
      summary: Get run results / reports
      tags:
        - Test Runs
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Run results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunResultDTO'

  /rest/domains/{domain}/projects/{project}/load-generators:
    get:
      summary: Get load generators (hosts)
      tags:
        - Load Generators
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of load generators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoadGeneratorDTO'
    post:
      summary: Register a load generator
      tags:
        - Load Generators
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadGeneratorDTO'
      responses:
        '201':
          description: Load generator registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadGeneratorDTO'

  /rest/domains/{domain}/projects/{project}/timeslots:
    get:
      summary: Get reservations / timeslots
      tags:
        - Timeslots
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of timeslots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeslotDTO'
    post:
      summary: Create/reserve timeslot
      tags:
        - Timeslots
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeslotDTO'
      responses:
        '201':
          description: Timeslot reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeslotDTO'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    DomainDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string

    ProjectDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        domainName:
          type: string
        description:
          type: string

    TestDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        domain:
          type: string
        project:
          type: string
        testType:
          type: string
        testFolder:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        vusers:
          type: integer

    TestCreateDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        testType:
          type: string
        testFolder:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        vusers:
          type: integer

    TestSetDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        domain:
          type: string
        project:
          type: string
        description:
          type: string

    RunDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        testId:
          type: integer
          format: int64
        testName:
          type: string
        domain:
          type: string
        project:
          type: string
        status:
          type: string
          enum: [INITIALIZING, RUNNING, STOPPING, FINISHED, FAILED, ABORTED]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        vusersCount:
          type: integer
        timeslotId:
          type: integer
          format: int64

    RunCreateRequestDTO:
      type: object
      required:
        - testId
      properties:
        testId:
          type: integer
          format: int64
        testInstanceId:
          type: integer
          format: int64
        timeslotId:
          type: integer
          format: int64
        postRunAction:
          type: string
          enum: [COLLATE_AND_ANALYZE, COLLATE, DO_NOTHING]

    RunResultDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        runId:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [RAW_RESULTS, ANALYSIS_REPORT, HTML_REPORT, SLA_REPORT, LOGS]
        fileUrl:
          type: string
        fileSizeBytes:
          type: integer
          format: int64

    LoadGeneratorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        domain:
          type: string
        project:
          type: string
        hostName:
          type: string
        ipAddress:
          type: string
        status:
          type: string
          enum: [OPERATIONAL, DOWN, BUSY, INACTIVE]
        location:
          type: string

    TimeslotDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        domain:
          type: string
        project:
          type: string
        startTime:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        vusersCount:
          type: integer
        status:
          type: string
          enum: [RESERVED, ACTIVE, EXPIRED, CANCELLED]
